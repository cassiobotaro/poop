schema: spec-driven

# Constraints an agent cannot infer from the code. Pointers, not copies: the
# documents named here are the source and change on their own schedule.
context: |
  POOP is a Python 3.15 interpreter infected by Smalltalk: every operation is a
  message sent to an object. The decisions that shape the language, and why
  each was made, are the ADRs in doc/adr/; read the ones that touch your area
  before proposing a validator, transformer or type. MIGRATION.md lists every
  banned construct with its substitute and what each type answers; the specs
  under openspec/specs/ record the observable behavior. AGENTS.md and
  CONTRIBUTING.md hold the contributor rules.
  Every OpenSpec artifact, like every repository document, is written in
  English, whatever language the conversation uses.
  README.md and MIGRATION.md are updated in the same commit as the code they
  describe, and so is the ADR a decision needs.
  Granularity: one change per theme, one task per finding. An audit with
  twenty findings is one change with twenty tasks, not twenty changes.

rules:
  specs:
    - >-
      Name a capability after what it covers, flat layout, kebab-case:
      "<builtin>-type" for a wrapper type (float-type for float),
      "<name>-validator" for a validator (no-len-validator for no_len),
      "<name>-transformer" for a transformer, and a plain noun for a
      cross-cutting behavior (block-arity).
    - >-
      Quote the exact sentence POOP answers in each THEN; the wording is the
      behavior.
  design:
    - >-
      A decision with a real alternative is written as an ADR in doc/adr/ (the
      next number, today's date, status Accepted; "Superseded by" on any ADR it
      replaces) in the same commit as the code it decides. design.md names the
      ADR and keeps only what is specific to the change; it does not restate
      the decision.
  proposal:
    - >-
      State what is out of scope and why, so a deliberate omission is not read
      as an oversight.
