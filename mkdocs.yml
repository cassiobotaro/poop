site_name: POOP
site_description: Python Object Oriented Programming — a Python interpreter infected by Smalltalk
site_url: https://cassiobotaro.github.io/poop/
repo_url: https://github.com/cassiobotaro/poop
repo_name: cassiobotaro/poop
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/emoticon-poop
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tutorial:
      - Overview: tutorial/index.md
      - 1. Strings: tutorial/01-strings.md
      - 2. Conditionals: tutorial/02-conditionals.md
      - 3. Iteration: tutorial/03-iteration.md
      - 4. Classes: tutorial/04-classes.md
      - 5. Collections: tutorial/05-collections.md
      - 6. Errors: tutorial/06-errors.md
  - Python vs POOP:
      - Overview: python-vs-poop/index.md
      - Conditionals: python-vs-poop/conditionals.md
      - Loops: python-vs-poop/loops.md
      - Builtins: python-vs-poop/builtins.md
  - REPL: repl.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
