[project]
name = "poop"
# Informational only — the project no longer publishes tagged releases.
version = "0.0.0"
description = "Python Object Oriented Programming — a Python interpreter infected by Smalltalk"
readme = "README.md"
requires-python = ">=3.15"
authors = [
    { name = "Cassio Botaro", email = "cassiobotaro@gmail.com" },
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
poop = "poop.cli:entry_point"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["poop*"]

[dependency-groups]
dev = [
    "prek>=0.4.13",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
addopts = "--cov=poop --cov-fail-under=95"
testpaths = "tests/"
strict_parametrization_ids = true

[tool.coverage.run]
branch = true
source = ["poop"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if not TYPE_CHECKING:",
  "raise NotImplementedError",
  '\.\.\.',
]
show_missing = true

[tool.ty.rules]
# POOP intentionally overrides __eq__/__ne__/__lt__ etc. to return Boolean
# (Smalltalk semantics) instead of bool — LSP violation is by design.
invalid-method-override = "ignore"

[[tool.ty.overrides]]
# The suite's blocks are written the way a POOP program writes them —
# `xs.map(lambda x: x._value * 2)` over a `List` whose element is `Object` —
# and `Object` declares neither the slot nor the operator, on purpose: a
# collection holds any POOP value. The same stance ruff takes on the mock
# helpers (`ANN001`–`ANN003` below): a test's block is loosely typed, so the
# two rules a loosely typed block trips are off here and nowhere else.
include = ["tests/**"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E4",
  "E7",
  "E9",
  "W",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # isort
  "I",
  # mccabe
  "C90",
  # flake8-bandit
  "S",
  # flake8-annotations
  "ANN",
  # flake-pyi
  "PYI",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # flake8-blind-except
  "BLE",
  # flake8-print — the language's own `print` is the one sanctioned call
  "T20",
  # import-outside-top-level: CONTRIBUTING.md allows a function-local import
  # only to break a cycle, so each one says which (`# noqa: PLC0415`)
  "PLC0415",
  # eq-without-hash: defining `__eq__` clears `__hash__`
  "PLW1641",
  # flake8-type-checking: CONTRIBUTING.md puts annotation-only imports inside
  # `if TYPE_CHECKING:`
  "TC",
  # ruff-specific, including RUF100, which keeps every `noqa` honest
  "RUF",
  # perflint, flake8-pie, flake8-return, flake8-use-pathlib, flake8-comprehensions,
  # refurb: the package passed them clean the day they went on
  "PERF",
  "PIE",
  "RET",
  "PTH",
  "C4",
  "FURB",
  # flake8-unused-arguments, tryceratops, flake8-builtins, pep8-naming and
  # pylint: each intentional site below carries a `noqa` and the reason
  "ARG",
  "TRY",
  "A",
  "N",
  "PL",
]
ignore = [
  # The configuration ClassVars of a validator (`messages`, `forbidden`) and of
  # a transformer (`rewriter`, `BINDINGS`) are annotated once on the base
  # class; ruff cannot see the inherited annotation.
  "RUF012",
  # A message named for the builtin it replaces — `abs`, `round`, `reversed`,
  # `format` — shadows it by design: that is the substitute `no_abs` names.
  "A003",
  # `ast.NodeVisitor` dispatches on `visit_<NodeName>`, CPython's own spelling.
  "N802",
  "N815",
  # `MessageNotUnderstood` is Smalltalk's name for the error, and `Mirror` is
  # the shape of a mirrored class, not an error of its own.
  "N818",
  # POOP composes every diagnostic at the raise site: the wording *is* the
  # work, and a sentence lives where the failure it describes does.
  "TRY003",
  # `len(args) > 2` reads as itself; a constant named for the count would not.
  "PLR2004",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  # use of assert detected
  "S101",
  # a test's lambdas, mocks and helpers take arguments they ignore, wrap a
  # call to spell a block, compare a value with itself to test `==`, name a
  # test after the `Try` it is about, and raise a native with a sentence
  "ARG001",
  "ARG002",
  "ARG005",
  "PLW0108",
  "PLR0124",
  "N802",
  "TRY003",
  # `sentinel` as a local: the value under test, not the 3.15 builtin
  "A001",
  # `match=` patterns are prose; an unescaped `.` matches itself too
  "RUF043",
  # mock helpers in tests deliberately use loose annotations
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN401",
  # private mock methods / inline staticmethods / dunders don't need return types
  "ANN202",
  "ANN204",
  "ANN205",
  # binding to 0.0.0.0 in ipaddress predicate tests is intentional
  "S104",
]
# The root of the type tree: every POOP type these name imports them first, so
# each of their imports of the package is necessarily lazy.
"poop/types/meta.py" = ["PLC0415"]
"poop/types/object.py" = ["PLC0415"]
# typer reads `main`'s annotations at runtime to build the CLI, so `Path` is
# a runtime import there, annotation or not.
"poop/cli.py" = ["TC003"]
# Each name there *is* POOP's `TypeError`, `ValueError`, …: the builtin's name,
# shadowed on purpose, so `raise mirrors.TypeError(...)` reads as what it is.
"poop/types/mirrors.py" = ["A001"]
"examples/**/*.py" = [
  # names injected at runtime by the POOP interpreter namespace
  "F821",
  # POOP programs are not annotated with Python types
  "ANN",
]
