[project]
name = "poop"
version = "0.1.0"
description = "Python Object Oriented Programming — a Python interpreter infected by Smalltalk"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Cassio Botaro", email = "cassiobotaro@gmail.com" },
]
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.3.9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[tool.pytest.ini_options]
addopts = "--cov=poop"
testpaths = "tests/"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E4",
  "E7",
  "E9",
  "W",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # isort
  "I",
  # mccabe
  "C90",
  # flake8-bandit
  "S",
  # flake8-annotations
  "ANN",
  # flake-pyi
  "PYI",
]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  # use of assert detected
  "S101"
]
"examples/*" = [
  # names injected at runtime by the POOP interpreter namespace
  "F821"
]
