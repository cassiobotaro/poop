[project]
name = "poop"
# Informational only — the project no longer publishes tagged releases.
version = "0.0.0"
description = "Python Object Oriented Programming — a Python interpreter infected by Smalltalk"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Cassio Botaro", email = "cassiobotaro@gmail.com" },
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
poop = "poop.cli:entry_point"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["poop*"]

[dependency-groups]
dev = [
    "prek>=0.4.13",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.pytest.ini_options]
addopts = "--cov=poop --cov-fail-under=95"
testpaths = "tests/"
strict_parametrization_ids = true

[tool.coverage.run]
branch = true
source = ["poop"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if not TYPE_CHECKING:",
  "raise NotImplementedError",
  '\.\.\.',
]
show_missing = true

[tool.ty.rules]
# POOP intentionally overrides __eq__/__ne__/__lt__ etc. to return Boolean
# (Smalltalk semantics) instead of bool — LSP violation is by design.
invalid-method-override = "ignore"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E4",
  "E7",
  "E9",
  "W",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # isort
  "I",
  # mccabe
  "C90",
  # flake8-bandit
  "S",
  # flake8-annotations
  "ANN",
  # flake-pyi
  "PYI",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # flake8-blind-except
  "BLE",
  # flake8-print — the language's own `print` is the one sanctioned call
  "T20",
  # import-outside-top-level: CONTRIBUTING.md allows a function-local import
  # only to break a cycle, so each one says which (`# noqa: PLC0415`)
  "PLC0415",
  # eq-without-hash: defining `__eq__` clears `__hash__`
  "PLW1641",
  # ruff-specific, including RUF100, which keeps every `noqa` honest
  "RUF",
]
ignore = [
  "ANN401",
  # The configuration ClassVars of a validator (`messages`, `forbidden`) and of
  # a transformer (`rewriter`, `BINDINGS`) are annotated once on the base
  # class; ruff cannot see the inherited annotation.
  "RUF012",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  # use of assert detected
  "S101",
  # `match=` patterns are prose; an unescaped `.` matches itself too
  "RUF043",
  # mock helpers in tests deliberately use loose annotations
  "ANN001",
  "ANN002",
  "ANN003",
  # private mock methods / inline staticmethods / dunders don't need return types
  "ANN202",
  "ANN204",
  "ANN205",
  # binding to 0.0.0.0 in ipaddress predicate tests is intentional
  "S104",
]
# The root of the type tree: every POOP type these name imports them first, so
# each of their imports of the package is necessarily lazy.
"poop/types/meta.py" = ["PLC0415"]
"poop/types/object.py" = ["PLC0415"]
"examples/**/*.py" = [
  # names injected at runtime by the POOP interpreter namespace
  "F821",
  # POOP programs are not annotated with Python types
  "ANN",
]
