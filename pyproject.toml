[project]
name = "poop"
version = "0.46.0"
description = "Python Object Oriented Programming — a Python interpreter infected by Smalltalk"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Cassio Botaro", email = "cassiobotaro@gmail.com" },
]
dependencies = ["typer>=0.15"]

[project.scripts]
poop = "poop.cli:entry_point"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["poop*"]

[dependency-groups]
dev = [
    "prek>=0.3.9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[tool.pytest.ini_options]
addopts = "--cov=poop"
testpaths = "tests/"
strict_parametrization_ids = true

[tool.coverage.run]
branch = true
source = ["poop"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '\.\.\.',
]
fail_under = 95
show_missing = true

[tool.ty.rules]
# POOP intentionally overrides __eq__/__ne__/__lt__ etc. to return Boolean
# (Smalltalk semantics) instead of bool — LSP violation is by design.
invalid-method-override = "ignore"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E4",
  "E7",
  "E9",
  "W",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # isort
  "I",
  # mccabe
  "C90",
  # flake8-bandit
  "S",
  # flake8-annotations
  "ANN",
  # flake-pyi
  "PYI",
]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  # use of assert detected
  "S101",
  # mock helpers in tests deliberately use loose annotations
  "ANN001",
  "ANN002",
  "ANN003",
  # private mock methods / inline staticmethods / dunders don't need return types
  "ANN202",
  "ANN204",
  "ANN205",
  # binding to 0.0.0.0 in ipaddress predicate tests is intentional
  "S104",
]
"examples/*" = [
  # names injected at runtime by the POOP interpreter namespace
  "F821",
  # POOP programs are not annotated with Python types
  "ANN",
]
