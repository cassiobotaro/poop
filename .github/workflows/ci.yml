name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --dev

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check poop/ tests/
      - run: uv run pytest
