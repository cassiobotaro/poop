name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history so we can verify the tag is on main and so
          # `gh ... --generate-notes` can diff against the previous tag.
          fetch-depth: 0

      - name: Verify tag commit is on main
        run: |
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag_sha}) is not on origin/main."
            exit 1
          fi

      - name: Verify pyproject.toml version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject_version="$(
            grep -E '^version = "[^"]+"' pyproject.toml \
              | head -n1 \
              | sed -E 's/^version = "([^"]+)"/\1/'
          )"
          if [ "$tag" != "$pyproject_version" ]; then
            echo "::error::Tag is v${tag} but pyproject.toml has version = \"${pyproject_version}\"."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Create GitHub Release with notes from git log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh's --generate-notes uses GitHub's PR-based template, which
          # is empty for direct-push workflows. Build notes from commit
          # subjects since the previous tag instead.
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            if [ -n "$prev_tag" ]; then
              git log "${prev_tag}..${GITHUB_REF_NAME}" --pretty=format:"- %s"
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev_tag" "$GITHUB_REF_NAME"
            else
              git log "${GITHUB_REF_NAME}" --pretty=format:"- %s"
              printf '\n'
            fi
          } > release_notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            --verify-tag
